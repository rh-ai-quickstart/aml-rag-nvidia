{{- if .Values.dashboards.vllm.enabled }}
kind: GrafanaDashboard
apiVersion: grafana.integreatly.org/v1beta1
metadata:
  name: vllm-{{ include "grafana.fullname" . }}
  namespace: {{ .Values.grafana.namespace }}
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  json: |
    {
      "title": "🚀 vLLM Metrics - All Models",
      "timezone": "browser",
      "schemaVersion": 16,
      "version": 0,
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "allowCustomValue": false,
            "label": "Prometheus",
            "name": "DS_PROMETHEUS",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "regex": "",
            "type": "datasource"
          },
          {
            "current": {
              "selected": false,
              "text": "All",
              "value": "$__all"
            },
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_PROMETHEUS}"
            },
            "definition": "label_values(up{job=~\".*-metrics\"}, namespace)",
            "hide": 0,
            "includeAll": true,
            "label": "Namespace",
            "multi": true,
            "name": "namespace",
            "options": [],
            "query": {
              "query": "label_values(up{job=~\".*-metrics\"}, namespace)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "sort": 0,
            "type": "query"
          },
          {
            "current": {
              "selected": false,
              "text": "All",
              "value": "$__all"
            },
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_PROMETHEUS}"
            },
            "definition": "label_values(up{namespace=~\"$namespace\",job=~\".*-metrics\"}, job)",
            "hide": 0,
            "includeAll": true,
            "label": "Model",
            "multi": true,
            "name": "model",
            "options": [],
            "query": {
              "query": "label_values(up{namespace=~\"$namespace\",job=~\".*-metrics\"}, job)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "sort": 0,
            "type": "query"
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Overview - Key Metrics",
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 0},
          "collapsed": false
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "title": "Avg TTFT (p95)",
          "type": "stat",
          "gridPos": {"h": 4, "w": 12, "x": 0, "y": 1},
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 500},
                  {"color": "red", "value": 1000}
                ]
              },
              "unit": "ms"
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "values": false,
              "calcs": ["lastNotNull"]
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(vllm:time_to_first_token_seconds_bucket{namespace=~\"$namespace\",job=~\"$model\"}[5m])) by (le)) * 1000",
              "legendFormat": ""
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "title": "Tokens/Sec (Avg)",
          "type": "stat",
          "gridPos": {"h": 4, "w": 12, "x": 12, "y": 1},
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "yellow", "value": 10},
                  {"color": "green", "value": 50}
                ]
              },
              "unit": "tps",
              "decimals": 2
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "values": false,
              "calcs": ["mean"]
            }
          },
          "targets": [
            {
              "expr": "sum(rate(vllm:generation_tokens_total{namespace=~\"$namespace\",job=~\"$model\"}[$__rate_interval]))",
              "legendFormat": ""
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "title": "Total Input Tokens",
          "type": "stat",
          "gridPos": {"h": 4, "w": 8, "x": 0, "y": 5},
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "blue", "value": null}
                ]
              },
              "unit": "short"
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "values": false,
              "calcs": ["sum"]
            }
          },
          "targets": [
            {
              "expr": "sum(increase(vllm:prompt_tokens_total{namespace=~\"$namespace\",job=~\"$model\"}[$__range]))",
              "legendFormat": "",
              "instant": true
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "title": "Total Output Tokens",
          "type": "stat",
          "gridPos": {"h": 4, "w": 8, "x": 8, "y": 5},
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "purple", "value": null}
                ]
              },
              "unit": "short"
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "values": false,
              "calcs": ["sum"]
            }
          },
          "targets": [
            {
              "expr": "sum(increase(vllm:generation_tokens_total{namespace=~\"$namespace\",job=~\"$model\"}[$__range]))",
              "legendFormat": "",
              "instant": true
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "title": "Completed Requests",
          "type": "stat",
          "gridPos": {"h": 4, "w": 8, "x": 16, "y": 5},
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null}
                ]
              },
              "unit": "short"
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "values": false,
              "calcs": ["sum"]
            }
          },
          "targets": [
            {
              "expr": "sum(increase(vllm:e2e_request_latency_seconds_count{namespace=~\"$namespace\",job=~\"$model\"}[$__range]))",
              "legendFormat": "",
              "instant": true
            }
          ]
        },
        {
          "type": "row",
          "title": "Request Metrics",
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 9},
          "collapsed": false
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "title": "Request Rate",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 10},
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": true
              },
              "unit": "reqps",
              "color": {
                "mode": "palette-classic"
              }
            }
          },
          "targets": [
            {
              "expr": "rate(vllm:num_requests_running{namespace=~\"$namespace\",job=~\"$model\"}[5m])",
              "legendFormat": "{{ "{{" }}job{{ "}}" }} - {{ "{{" }}namespace{{ "}}" }}"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "title": "Request Completion Rate",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 10},
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": true
              },
              "unit": "reqps",
              "color": {
                "mode": "palette-classic"
              }
            }
          },
          "targets": [
            {
              "expr": "sum(rate(vllm:e2e_request_latency_seconds_count{namespace=~\"$namespace\",job=~\"$model\"}[5m])) by (job, namespace)",
              "legendFormat": "{{ "{{" }}job{{ "}}" }} - {{ "{{" }}namespace{{ "}}" }}"
            }
          ]
        },
        {
          "type": "row",
          "title": "Performance Metrics",
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 18},
          "collapsed": false
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "title": "Time to First Token (ms) - p95",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 19},
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": true
              },
              "unit": "ms",
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 500},
                  {"color": "red", "value": 1000}
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, rate(vllm:time_to_first_token_seconds_bucket{namespace=~\"$namespace\",job=~\"$model\"}[5m])) * 1000",
              "legendFormat": "p95 {{ "{{" }}job{{ "}}" }}"
            }
          ]
        },
        {
          "type": "row",
          "title": "Token Metrics",
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 27},
          "collapsed": false
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "title": "Tokens Per Second",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 28},
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": true
              },
              "unit": "tps",
              "color": {
                "mode": "palette-classic"
              }
            }
          },
          "targets": [
            {
              "expr": "rate(vllm:generation_tokens_total{namespace=~\"$namespace\",job=~\"$model\"}[5m])",
              "legendFormat": "{{ "{{" }}job{{ "}}" }} - {{ "{{" }}namespace{{ "}}" }}"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "title": "Token Usage - Input vs Output",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 28},
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": true
              },
              "unit": "tps"
            },
            "overrides": [
              {
                "matcher": {"id": "byRegexp", "options": "/Input.*/"},
                "properties": [
                  {"id": "color", "value": {"mode": "fixed", "fixedColor": "blue"}}
                ]
              },
              {
                "matcher": {"id": "byRegexp", "options": "/Output.*/"},
                "properties": [
                  {"id": "color", "value": {"mode": "fixed", "fixedColor": "purple"}}
                ]
              }
            ]
          },
          "targets": [
            {
              "expr": "rate(vllm:prompt_tokens_total{namespace=~\"$namespace\",job=~\"$model\"}[5m])",
              "legendFormat": "Input - {{ "{{" }}job{{ "}}" }}"
            },
            {
              "expr": "rate(vllm:generation_tokens_total{namespace=~\"$namespace\",job=~\"$model\"}[5m])",
              "legendFormat": "Output - {{ "{{" }}job{{ "}}" }}"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "title": "Total Tokens Processed",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 36},
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": true
              },
              "unit": "short"
            },
            "overrides": [
              {
                "matcher": {"id": "byRegexp", "options": "/Input.*/"},
                "properties": [
                  {"id": "color", "value": {"mode": "fixed", "fixedColor": "blue"}}
                ]
              },
              {
                "matcher": {"id": "byRegexp", "options": "/Output.*/"},
                "properties": [
                  {"id": "color", "value": {"mode": "fixed", "fixedColor": "purple"}}
                ]
              }
            ]
          },
          "targets": [
            {
              "expr": "vllm:prompt_tokens_total{namespace=~\"$namespace\",job=~\"$model\"}",
              "legendFormat": "Input - {{ "{{" }}job{{ "}}" }}"
            },
            {
              "expr": "vllm:generation_tokens_total{namespace=~\"$namespace\",job=~\"$model\"}",
              "legendFormat": "Output - {{ "{{" }}job{{ "}}" }}"
            }
          ]
        }
      ]
    }
{{- end }}